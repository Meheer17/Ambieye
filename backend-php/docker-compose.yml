version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ambieye-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ambieye
      MYSQL_USER: ambieye
      MYSQL_PASSWORD: ambieye123
    ports:
      - "3306:3306"
    volumes:
      - ./database_schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    networks:
      - ambieye-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  php:
    build: .
    container_name: ambieye-backend-php
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ambieye
      DB_PASSWORD: ambieye123
      DB_NAME: ambieye
      JWT_SECRET: your-secret-key-change-in-production
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - ambieye-network

volumes:
  mysql_data:

networks:
  ambieye-network:
    driver: bridge
