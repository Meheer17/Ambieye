name: End-to-End & API Tests (Selenium, API, Load)

on:
  push:
    branches: [ mahi ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ambieye_app/package-lock.json

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install frontend dependencies
        run: |
          cd ambieye_app
          npm install

      - name: Install Selenium test dependencies
        run: |
          cd ambieye_app/tests/selenium
          npm install

      - name: Install API test dependencies
        run: |
          cd ambieye_app/tests/api
          npm install

      - name: Install Load test dependencies
        run: |
          cd ambieye_app/tests/load
          npm install

      - name: Start Expo Web Server
        run: |
          cd ambieye_app
          # Start Expo Web with CI=1 to prevent interactive mode prompts
          CI=1 npx expo start --web &
          
          # Wait for Expo Web port 8081 to be up and running
          echo "Waiting for web server to start on port 8081..."
          timeout 120s bash -c '
            until curl -s http://localhost:8081 > /dev/null; do
              sleep 2
            done
          '
          echo "Web server is up!"

      - name: Run Selenium E2E Tests
        run: |
          cd ambieye_app/tests/selenium
          HEADLESS=true APP_URL=http://localhost:8081 npm test
        continue-on-error: true

      - name: Run API Tests
        run: |
          cd ambieye_app/tests/api
          npm test
        continue-on-error: true

      - name: Run Load & Performance Tests
        run: |
          cd ambieye_app/tests/load
          npm test
        continue-on-error: true

      - name: Compile and Generate Reports
        if: always()
        run: |
          cd ambieye_app/tests
          node generate_report.js

      - name: Upload Test Results Spreadsheet (Excel/CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-excel
          path: ambieye_app/tests/test_results.csv
